[workspace]
resolver = "3"
members = ["rclweb", "rclwebd", "scripts/fixture-gen", "scripts/protocol-fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"

# Fat LTO ship profile for the wasm artifact (R-D1 reopen inputs).
[profile.release-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
