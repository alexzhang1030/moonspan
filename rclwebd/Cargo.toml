[package]
name = "rclwebd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Serialized-only rcl attachment (links a ROS 2 installation; see
# docs/gateway/rclwebd.md for the environment contract). Typesupport is
# resolved at runtime via dlopen (R3-04); pair ROS_PREFIX with RCLWEBD_SUPPORT_ROW.
ros = ["dep:libloading"]
# HTTP/3 WebTransport accept loop (wtransport/quinn). Off by default so
# `just check` stays light; enable for local WT bring-up.
webtransport = ["dep:wtransport"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1.12.1"
libloading = { version = "0.8", optional = true }
rcgen = "0.14"
rclweb = { path = "../rclweb" }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
wtransport = { version = "0.7", optional = true, default-features = true }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"

[[bin]]
name = "rclwebd"
path = "src/main.rs"
required-features = ["ros"]
