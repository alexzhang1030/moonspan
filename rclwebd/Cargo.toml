[package]
name = "rclwebd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Serialized-only rcl attachment (links a ROS 2 installation; see
# docs/gateway/rclwebd.md for the environment contract). Typesupport is
# resolved at runtime via dlopen (R3-04); pair ROS_PREFIX with RCLWEBD_SUPPORT_ROW.
ros = ["dep:libloading"]
# HTTP/3 WebTransport accept loop (wtransport/quinn). Off by default so
# `just check` stays light; enable for local WT bring-up.
webtransport = ["dep:wtransport"]

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
jsonwebtoken.workspace = true
libloading = { workspace = true, optional = true }
rcgen.workspace = true
rclweb = { path = "../rclweb" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
wtransport = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["sink", "std"] }
tokio-tungstenite.workspace = true

[[bin]]
name = "rclwebd"
path = "src/main.rs"
required-features = ["ros"]
