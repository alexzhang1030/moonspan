# rclweb foundation CI lane.
# Pinned toolchains and the root command surface on every push and PR.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Official just 1.50.0 x86_64-unknown-linux-musl archive digest from release SHA256SUMS.
      JUST_ARCHIVE_SHA256: 27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore dependency caches
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-foundation-deps-${{ hashFiles('.bun-version', '.just-version', 'rust-toolchain.toml', 'bun.lock', 'Cargo.lock', 'package.json', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-foundation-deps-

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Rust via rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "error: rust-toolchain.toml [toolchain].channel is empty or missing" >&2
            exit 1
          fi
          if [[ ! "${channel}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: rust-toolchain.toml channel has unexpected format: ${channel}" >&2
            exit 1
          fi
          rustup toolchain install "${channel}" --profile minimal \
            --component rustfmt --component clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install just 1.50.0 (linux musl, SHA256 verified)
        shell: bash
        run: |
          set -euo pipefail
          just_version="$(tr -d '[:space:]' < .just-version)"
          if [[ "${just_version}" != "1.50.0" ]]; then
            echo "error: .just-version is ${just_version}; workflow pins 1.50.0 asset" >&2
            exit 1
          fi
          asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/casey/just/releases/download/${just_version}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          bin_dir="${RUNNER_TEMP}/rclweb-bin"
          curl -fsSL -L -o "${archive}" "${url}"
          echo "${JUST_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" just
          chmod +x "${bin_dir}/just"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/just" --version

      - name: Install JavaScript workspace (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: just toolchain-check
        shell: bash
        run: just toolchain-check

      - name: just check
        shell: bash
        run: just check

      - name: just test
        shell: bash
        run: just test

      - name: just build
        shell: bash
        run: just build
