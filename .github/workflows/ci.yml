# Moonspan foundation CI lane (M0 tooling evidence).
# Local actionlint + pinned root commands are the current evidence surface.
# The first hosted run will record artifact URLs for review.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Recompute when the official installer content changes (platform/release owner).
      MOONBIT_INSTALLER_SHA256: 46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe
      # Official just 1.50.0 x86_64-unknown-linux-musl archive digest from release SHA256SUMS.
      JUST_ARCHIVE_SHA256: 27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize evidence placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "status=not-started"
            echo "revision=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "uname=$(uname -a)"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=${GITHUB_JOB}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "lane=foundation"
            echo "dependency_cache_hit=pending"
            echo "moonbit_installer_sha256=${MOONBIT_INSTALLER_SHA256}"
            echo "just_archive_sha256=${JUST_ARCHIVE_SHA256}"
            echo "initialized_at=${stamp}"
          } > artifacts/ci/environment.txt
          for log in toolchain-check check test build; do
            {
              echo "status=not-started"
              echo "revision=${GITHUB_SHA}"
              echo "lane=foundation"
              echo "recipe=${log}"
              echo "initialized_at=${stamp}"
            } > "artifacts/ci/${log}.log"
          done

      - name: Restore dependency caches
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .mooncakes
          key: ${{ runner.os }}-${{ runner.arch }}-m0-foundation-deps-${{ hashFiles('.bun-version', '.moon-version', '.just-version', 'rust-toolchain.toml', 'bun.lock', 'Cargo.lock', 'package.json', 'Cargo.toml', 'moon.work') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-m0-foundation-deps-

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Rust via rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          # rust-toolchain.toml drives rustup once the matching toolchain is present.
          # Read channel with strict shell only (no extra language runtime).
          channel="$(
            awk '
              BEGIN { in_toolchain = 0 }
              /^\[toolchain\][[:space:]]*(#.*)?$/ { in_toolchain = 1; next }
              /^\[/ { in_toolchain = 0 }
              in_toolchain && /^[[:space:]]*channel[[:space:]]*=[[:space:]]*"/ {
                line = $0
                sub(/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            ' rust-toolchain.toml
          )"
          if [[ -z "${channel}" ]]; then
            echo "error: rust-toolchain.toml [toolchain].channel is empty or missing" >&2
            exit 1
          fi
          if [[ ! "${channel}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: rust-toolchain.toml channel has unexpected format: ${channel}" >&2
            exit 1
          fi
          rustup toolchain install "${channel}" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install MoonBit (verified official installer)
        shell: bash
        run: |
          set -euo pipefail
          moon_version="$(tr -d '[:space:]' < .moon-version)"
          if [[ -z "${moon_version}" ]]; then
            echo "error: .moon-version is empty" >&2
            exit 1
          fi
          installer_url="https://cli.moonbitlang.com/install/unix.sh"
          installer_path="${RUNNER_TEMP}/moonspan-unix.sh"
          curl -fsSL -o "${installer_path}" "${installer_url}"
          echo "${MOONBIT_INSTALLER_SHA256}  ${installer_path}" | sha256sum -c -
          moon_home="${RUNNER_TEMP}/moonspan-moon-home"
          mkdir -p "${moon_home}"
          export MOON_HOME="${moon_home}"
          bash "${installer_path}" "${moon_version}"
          echo "MOON_HOME=${moon_home}" >> "${GITHUB_ENV}"
          echo "${moon_home}/bin" >> "${GITHUB_PATH}"
          "${moon_home}/bin/moon" version --all
          "${moon_home}/bin/moonc" -v

      - name: Install just 1.50.0 (linux musl, SHA256 verified)
        shell: bash
        run: |
          set -euo pipefail
          just_version="$(tr -d '[:space:]' < .just-version)"
          if [[ "${just_version}" != "1.50.0" ]]; then
            echo "error: .just-version is ${just_version}; workflow pins 1.50.0 asset" >&2
            exit 1
          fi
          asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/casey/just/releases/download/${just_version}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          bin_dir="${RUNNER_TEMP}/moonspan-bin"
          curl -fsSL -L -o "${archive}" "${url}"
          echo "${JUST_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" just
          chmod +x "${bin_dir}/just"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/just" --version

      - name: Install JavaScript workspace (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Record environment and tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=recorded"
            echo "revision=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "uname=$(uname -a)"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=${GITHUB_JOB}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "lane=foundation"
            echo "dependency_cache_hit=${{ steps.dependency-cache.outputs.cache-hit }}"
            echo "moonbit_installer_sha256=${MOONBIT_INSTALLER_SHA256}"
            echo "just_archive_sha256=${JUST_ARCHIVE_SHA256}"
            echo "bun=$(bun --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "moon=$(moon version --all | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
            echo "moonc=$(moonc -v)"
            echo "just=$(just --version)"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee artifacts/ci/environment.txt

      - name: just toolchain-check
        shell: bash
        run: |
          set -euo pipefail
          just toolchain-check 2>&1 | tee artifacts/ci/toolchain-check.log

      - name: just check
        shell: bash
        run: |
          set -euo pipefail
          just check 2>&1 | tee artifacts/ci/check.log

      - name: just test
        shell: bash
        run: |
          set -euo pipefail
          just test 2>&1 | tee artifacts/ci/test.log

      - name: just build
        shell: bash
        run: |
          set -euo pipefail
          just build 2>&1 | tee artifacts/ci/build.log

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moonspan-documentation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            README.md
            docs
            .agents/docs
            tasks
            .github/workflows/ci.yml
            .bun-version
            .moon-version
            .just-version
            rust-toolchain.toml
            bun.lock
            Cargo.lock
            package.json
            Cargo.toml
            moon.work
            bunfig.toml
            artifacts/ci/check.log
            artifacts/ci/environment.txt

      - name: Upload test and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moonspan-test-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            artifacts/ci/environment.txt
            artifacts/ci/toolchain-check.log
            artifacts/ci/test.log
            artifacts/ci/build.log
