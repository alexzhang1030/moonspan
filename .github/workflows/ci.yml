# rclweb foundation CI lane.
# Pinned toolchains and the root command surface on every push and PR.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore dependency caches
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-foundation-deps-${{ hashFiles('.bun-version', '.just-version', 'rust-toolchain.toml', 'bun.lock', 'Cargo.lock', 'package.json', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-foundation-deps-

      - name: Read toolchain pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          just_version="$(tr -d '[:space:]' < .just-version)"
          channel="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "error: rust-toolchain.toml [toolchain].channel is empty or missing" >&2
            exit 1
          fi
          if [[ ! "${channel}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: rust-toolchain.toml channel has unexpected format: ${channel}" >&2
            exit 1
          fi
          echo "just=${just_version}" >> "${GITHUB_OUTPUT}"
          echo "rust=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up just from .just-version
        id: setup-just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.pins.outputs.just }}

      - name: Wait before retrying just
        if: steps.setup-just.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Set up just from .just-version (retry)
        if: steps.setup-just.outcome == 'failure'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.pins.outputs.just }}

      - name: Set up Rust from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install JavaScript workspace (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: just toolchain-check
        shell: bash
        run: just toolchain-check

      - name: just check
        shell: bash
        run: just check

      - name: just test
        shell: bash
        run: just test

      - name: H-FT mock protocol gate (R3-03)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p rclweb --lib h_ft_session_ready
          cargo test --locked -p rclwebd --test ws_gateway h_ft

      - name: just build
        shell: bash
        run: just build

  h-ft-protocol:
    name: h-ft-protocol-mock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: foundation
    # Optional evidence-gated lane: mock H-FT protocol without Humble ROS packages.
    # Skipped unless dispatched or labeled; foundation already runs the same cargo tests.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run H-FT mock protocol compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/compose.r3-03-h-ft.yml build
          docker compose -f docker/compose.r3-03-h-ft.yml run --rm h-ft-protocol

      - name: Upload H-FT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-03-h-ft-evidence
          path: docs/evidence/r3-03-h-ft-row.json
          if-no-files-found: warn

  e2e:
    name: e2e-ros-talker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: foundation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run R1 e2e compose (Jazzy talker → SDK)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/compose.r1-e2e.yml build
          docker compose -f docker/compose.r1-e2e.yml run --rm e2e

      - name: Upload R1 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-evidence
          path: |
            docs/evidence/r1-04-wasm-size.json
            docs/evidence/r1-05-poll-latency.json
            docs/evidence/r1-05-e2e.json
          if-no-files-found: warn

  e2e-h-ft:
    name: e2e-ros-talker-h-ft
    runs-on: ubuntu-24.04
    # Humble image regenerates bindgen + links rcl; first build is heavier than J-FT.
    timeout-minutes: 75
    needs: foundation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run H-FT e2e compose (Humble talker → SDK)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/compose.r3-03-h-ft-e2e.yml build
          docker compose -f docker/compose.r3-03-h-ft-e2e.yml run --rm e2e-h-ft

      - name: Upload H-FT live e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-03-h-ft-e2e-evidence
          path: docs/evidence/r3-03-h-ft-e2e.json
          if-no-files-found: warn
