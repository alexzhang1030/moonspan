# R2-04 live performance baseline lane (J-FT).
# Opt-in: `just perf-baseline-live` or RCLWEB_PERF_LIVE=1 with Docker.
services:
  perf:
    build:
      context: ..
      dockerfile: docker/Dockerfile.r2-04-perf
    environment:
      ROS_DOMAIN_ID: "0"
      RCLWEBD_BIND: "127.0.0.1:8794"
      RCLWEB_GATEWAY_URL: "ws://127.0.0.1:8794/ws"
      FOXGLOVE_URL: "ws://127.0.0.1:8765"
      ROSBRIDGE_URL: "ws://127.0.0.1:9090"
      RCLWEB_PERF_SAMPLES: "50"
      RCLWEB_PERF_TIMEOUT_MS: "60000"
