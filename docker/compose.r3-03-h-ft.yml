# R3-03 H-FT mock protocol e2e (evidence-gated)
#
# Proves SessionReady H-FT + moonspan OpenChannel without Humble ROS packages.
# Live Humble rcl attachment remains Qualification-target / evidence-gated until
# a Humble-linked gateway artifact lands.
services:
  h-ft-protocol:
    build:
      context: ..
      dockerfile: docker/Dockerfile.r3-03-h-ft-mock
    environment:
      RCLWEB_EVIDENCE_DIR: "/workspace/docs/evidence"
    volumes:
      - ../docs/evidence:/workspace/docs/evidence
