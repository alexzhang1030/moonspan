# Optional local hooks (prek 0.4.9, same pin as vue-vet). Not part of
# `just check`; CI remains the gate. Install with `just install-hooks`.
minimum_prek_version: "0.4.9"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: just fmt-check
        language: system
        pass_filenames: false
        types_or: [rust, toml]
