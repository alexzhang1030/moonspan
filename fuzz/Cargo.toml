[package]
name = "rclweb-fuzz"
version = "0.0.0"
license = "Apache-2.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rclweb = { path = "../rclweb" }

[[bin]]
name = "parse_bootstrap"
path = "fuzz_targets/parse_bootstrap.rs"
