test = false
bench = false

[[bin]]
name = "parse_frame"
path = "fuzz_targets/parse_frame.rs"
doc = false
test = false
bench = false

[[bin]]
name = "decode_cbor"
path = "fuzz_targets/decode_cbor.rs"
doc = false
test = false
bench = false

[[bin]]
name = "cdr_reader"
path = "fuzz_targets/cdr_reader.rs"
doc = false
test = false
bench = false
